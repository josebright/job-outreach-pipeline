# config.example.yaml
# Copy to config.yaml and edit. Everything tunable without code changes.
# Validated against src/pipeline/config/schema.js on load.

tracks_enabled: [A]           # A = remote-from-Nigeria (no visa needed). Track B removed per priority-gate design.

# ── Priority gates (evaluated in order; first fail short-circuits) ──
# 1. Remote-from-Nigeria  → location
# 2. Pay ≥ minimum        → gates.pay_minimum_annual (below)
# 3. Skillset match       → stack (below)
# 4. Company size 2-500   → scoring.reject_size_bands (below)
# 5. Not previously contacted (90 days)
# 6. Posting freshness    → gates.max_posting_age_days (below)
# 7. Have contact email   (checked at draft time, not qualify)
gates:
  pay_minimum_annual: 24000   # USD/EUR/GBP; unstated salary passes through
  max_posting_age_days: 30    # closer date scores higher within the window

# ── Stack fit (Q1 filter) ──────────────────────────────────────
stack:
  keywords:
    # Role titles — mirror of ROLE_MARKERS so a valid engineering title
    # always satisfies the keyword check even when the job description
    # doesn't explicitly list a stack (common at early-stage startups).
    - software engineer
    - software developer
    - backend engineer
    - frontend engineer
    - fullstack engineer
    - founding engineer
    - product engineer
    - research engineer
    - web engineer
    - mobile engineer
    - swe
    # Primary stack
    - node
    - nodejs
    - typescript
    - javascript
    - react
    - nestjs
    - prisma
    - postgresql
    - postgres
    - flutter
    - redis
    - bullmq
    # Common adjacent tech at remote-first startups
    - docker
    - sql
    - graphql
    - aws
    - gcp
    # Location signals (existing — help jobs where the description
    # restates the remote nature without listing a specific stack)
    - remote
    - worldwide
  seniority_accept: [senior, staff, principal, lead, sr, sr., "mid-senior"]
  seniority_reject: [intern, internship, junior, jr, graduate, "new grad", entry, entry-level]
  # Junior override: accept a rejected-seniority role if the posting states
  # an explicit annual salary >= this number in USD/EUR/GBP. 36000 = 3000/mo.
  junior_override_min_annual: 36000

# ── Location fit (Q2 filter) ───────────────────────────────────
location:
  allow:
    - remote worldwide
    - remote (worldwide)
    - worldwide
    - anywhere
    - remote - anywhere
    - fully remote
    - emea
    - europe/africa
    - africa
    - global
  deny:
    - "us only"
    - "u.s. only"
    - "usa only"
    - "united states only"
    - "us-based only"
    - "us based only"
    - "us residents"
    - "us resident only"
    - "must be located in the us"
    - "must reside in"
    - "must be a us citizen"
    - "us citizen only"
    - "us citizens only"
    - "authorized to work in the u"
    - "eligible to work in the us"
    - "us timezone"
    - "us time zone"
    - "us timezones only"
    - "eastern time zone"
    - "pacific time zone"
    - "eu citizens only"
    - "eu residents only"
    - "remote (us)"
    - "remote us"
    - "remote - us"
    - "remote, us"
    - "remote in the us"
    - "north america only"
    - "n. america only"
    - "americas only"
    - "canada only"
    - "canadian residents"
    - "uk only"
    - "uk residents only"
    - "germany only"
    - "france only"
    - "india only"

# ── Currency fit (Q3 filter) ───────────────────────────────────
currency:
  accept: [USD, EUR, GBP]
  hq_country_currency_map:
    US: USD
    GB: GBP
    UK: GBP
    IE: EUR
    DE: EUR
    NL: EUR
    FR: EUR
    ES: EUR
    IT: EUR
    PT: EUR
    SE: EUR
    DK: EUR
    NO: EUR
    FI: EUR
    CH: USD
    CA: USD
    AU: USD
  contractor_signal_words: [deel, remote.com, oyster, "hire anywhere", "employer of record", "eor"]

# ── Scoring ────────────────────────────────────────────────────
scoring:
  threshold: 40
  weights:
    nigeria_presence: 30
    explicit_salary: 15
    remote_worldwide: 15
    recent_post_days: 15
    stack_overlap: 10
    company_size_sweet_spot: 20    # was 10; boosted for small startups
    seed_stage_bonus: 5            # extra for 11-50 (founder-read email)
    eor_mention: 5
  # Hard filter: skip any company at or above these size bands.
  # Enterprise recruiting funnels through ATS + agencies and rarely
  # replies to cold outreach. Backed by 2026 response-rate data.
  # Hard ceiling: 500 employees. Anything at or above 501 is dropped.
  # Priority tier (2-100) is enforced separately in runDraft ordering.
  reject_size_bands: ["501-1000", "1000+", "1001-5000", "5001-10000", "10001+", "10000+"]

# ── Discovery ──────────────────────────────────────────────────
discover:
  serp_provider: brave        # brave (free 2000/mo, site: supported) | serper (paid) | google_pse (closed to new customers as of 2026) | serpapi
  monthly_query_budget: 500
  ats_platforms: [greenhouse, lever, ashby, workable, smartrecruiters]
  # remotive + remoteok = job-board aggregators
  # hn             = Hacker News "Ask HN: Who is hiring?" monthly thread
  # yc             = Y Combinator public company directory (all sizes, we filter to ≤500)
  # wwr            = We Work Remotely programming RSS feed
  # hunter_discover = Hunter /v2/discover (FREE, no credits) — companies actively hiring,
  #                   filtered by headcount 11-500 + job_openings.hiring:true + last 7 days.
  #                   Returns 403 if your tier doesn't support it (run continues without it).
  aggregator_feeds: [remotive, remoteok, hn, yc, wwr, hunter_discover]
  seed_csv_path: data/seed_companies.csv

# ── Enrichment ─────────────────────────────────────────────────
enrichment:
  providers: [hunter]         # add apollo when key is available
  monthly_budget: 2000        # Hunter Starter tier (2,000 credits/month)
  min_email_status_for_auto_send: verified

# ── LLM ────────────────────────────────────────────────────────
llm:
  drafts_provider: anthropic
  drafts_model: claude-sonnet-4-6
  classifier_provider: gemini
  classifier_model: gemini-2.0-flash
  prompt_version: outreach_v2      # 3-variant rotation (observation / question / direct)
  monthly_budget: 500          # cap on generateDraft calls per month; 500 covers ~15/day plus retries

# ── Send ───────────────────────────────────────────────────────
send:
  domain: capacitydey.org
  sender_email: bright@capacitydey.org     # change to uchenna@capacitydey.org once alias exists
  sender_name: Uchenna Ugwumadu
  reply_to: uchennaugwumadu8@gmail.com     # remove once mail forwarding is set up on the domain
  daily_cap_initial: 15                 # Mon-Sat weekday cap once warm-up completes
  daily_cap_followup: 15
  sunday_cap_initial: 3                 # Sunday-specific cap (low signal, spam-prone)
  research_daily_cap: 2                 # extra bucket for Research Engineer roles; does not eat main cap
  send_window_local_start: "08:30"
  send_window_local_end: "11:00"
  bounce_rate_alarm_pct: 3
  # Cold-mailbox warm-up. Ramps 10/day -> 15/day over 10 days from this
  # start date. Remove or set to null once ramp is complete.
  warmup_start_date: "2026-08-14"
