# data/profile.yaml
# The profile pack the LLM reads when drafting each outreach email.
# Sourced from resume.pdf; edit any line that no longer reflects reality.
#
# Rules of thumb:
# - Only facts that are true today. The prompt is instructed not to invent.
# - Achievements are quantified. Numbers and outcomes over adjectives.

name: Uchenna Bright Ugwumadu
title: Cloud Software Engineer and Full-Stack Developer
location: Abuja, Nigeria
timezone: WAT (UTC+1)

# Timezone facts the LLM can pick from for the friction-removal sentence.
timezone_notes:
  - full overlap with EU working hours
  - 4 to 6 hours of overlap with US East Coast mornings

# Contractor readiness. Track A uses this. Track B replaces it with relocation notes.
contractor:
  ready: true
  platforms: [Deel, Remote.com, Oyster]
  note: set up as an independent contractor, invoice directly or via any EOR

# Public links. These render in every signature.
