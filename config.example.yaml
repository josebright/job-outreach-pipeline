# config.example.yaml
# Copy to config.yaml and edit. Everything tunable without code changes.
# Validated against src/pipeline/config/schema.js on load.

tracks_enabled: [A]           # A = remote-from-Nigeria. Track B (visa) is deprecated.

# ── Priority gates (evaluated in order; first fail short-circuits) ──
gates:
  pay_minimum_annual: 24000   # USD/EUR/GBP; unstated salary passes through
  max_posting_age_days: 30    # closer date scores higher within the window

# ── Stack fit (Q1 filter) ──────────────────────────────────────
stack:
  keywords:
    - software engineer
    - backend engineer
    - fullstack engineer
    - node
    - nodejs
    - python
    - typescript
    - react
    - nestjs
    - prisma
    - postgresql
    - flutter
    - redis
    - bullmq
    - remote
    - worldwide
  seniority_accept: [senior, staff, principal, lead, sr, sr., "mid-senior"]
  seniority_reject: [intern, internship, junior, jr, graduate, "new grad", entry, entry-level]
  # Junior override: accept a rejected-seniority role if the posting states
  # an explicit annual salary >= this number in USD/EUR/GBP. 36000 = 3000/mo.
  junior_override_min_annual: 36000

# ── Location fit (Q2 filter) ───────────────────────────────────
location:
  allow:
    - remote worldwide
    - remote (worldwide)
    - worldwide
    - anywhere
    - remote - anywhere
    - fully remote
    - emea
    - europe/africa
    - africa
    - global
  deny:
    - "us only"
    - "u.s. only"
    - "usa only"
    - "united states only"
    - "us-based only"
    - "us based only"
    - "us residents"
    - "must reside in"
    - "must be a us citizen"
    - "us citizens only"
    - "authorized to work in the u"
    - "us timezone"
    - "us time zone"
    - "eastern time zone"
    - "pacific time zone"
    - "eu citizens only"
    - "remote (us)"
    - "remote us"
    - "remote - us"
    - "north america only"
    - "canada only"
    - "canadian residents"
    - "uk only"

# ── Currency fit (Q3 filter) ───────────────────────────────────
currency:
  accept: [USD, EUR, GBP]
  hq_country_currency_map:
    US: USD
    GB: GBP
    UK: GBP
    IE: EUR
    DE: EUR
    NL: EUR
    FR: EUR
    ES: EUR
    IT: EUR
    PT: EUR
    SE: EUR
    DK: EUR
    NO: EUR
    FI: EUR
    CH: USD
    CA: USD
    AU: USD
  contractor_signal_words: [deel, remote.com, oyster, "hire anywhere", "employer of record", "eor"]

# ── Scoring ────────────────────────────────────────────────────
scoring:
  threshold: 40
  weights:
    nigeria_presence: 30
    explicit_salary: 15
    remote_worldwide: 15
    recent_post_days: 15
    stack_overlap: 10
    company_size_sweet_spot: 20    # boosted for small startups (11-200)
    seed_stage_bonus: 5            # extra for 11-50 (founder-read email)
    eor_mention: 5
  # Hard filter: skip any company at or above these size bands.
  # Enterprise recruiting funnels through ATS + agencies and rarely
  # replies to cold outreach.
  # Hard ceiling: 500 employees. Anything at or above 501 is dropped.
  reject_size_bands: ["501-1000", "1000+", "1001-5000", "5001-10000", "10001+", "10000+"]

# ── Discovery ──────────────────────────────────────────────────
discover:
  serp_provider: brave        # brave (free 2000/mo, site: supported) | serper (paid) | google_pse (closed to new customers as of 2026) | serpapi
  monthly_query_budget: 500
  ats_platforms: [greenhouse, lever, ashby, workable, smartrecruiters]
  aggregator_feeds: [remotive, remoteok, hn, yc, wwr]
  seed_csv_path: data/seed_companies.csv

# ── Enrichment ─────────────────────────────────────────────────
enrichment:
  providers: [hunter]         # add apollo when key is available
  monthly_budget: 2000        # Hunter Starter tier (2,000 credits/month); free tier = 50
  min_email_status_for_auto_send: verified

# ── LLM ────────────────────────────────────────────────────────
llm:
  drafts_provider: anthropic
  drafts_model: claude-sonnet-4-6
  classifier_provider: gemini
  classifier_model: gemini-2.0-flash
  prompt_version: outreach_v2      # 3-variant rotation to avoid template fatigue
  monthly_budget: 500          # cap on generateDraft calls per month

# ── Send ───────────────────────────────────────────────────────
send:
  domain: capacitydey.org
  sender_email: bright@capacitydey.org     # change to uchenna@capacitydey.org once alias exists
  sender_name: Uchenna Ugwumadu
  reply_to: uchennaugwumadu8@gmail.com     # remove once mail forwarding is set up on the domain
  daily_cap_initial: 15                 # Mon-Sat weekday cap once warm-up completes
  daily_cap_followup: 15
  sunday_cap_initial: 3                 # Sunday-specific cap (low signal, spam-prone)
  research_daily_cap: 2                 # extra bucket for Research Engineer roles; does not eat main cap
  send_window_local_start: "08:30"
  send_window_local_end: "11:00"
  bounce_rate_alarm_pct: 3
  # Cold-mailbox warm-up. Ramps 10/day -> 15/day over 10 days from this
  # start date. Set to an ISO date (YYYY-MM-DD) to enable. Leave blank/null
  # once the mailbox is warmed.
  warmup_start_date: null
