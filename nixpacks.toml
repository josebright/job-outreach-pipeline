# Force Railway (Nixpacks) to use Node 22 LTS.
# Without this, Nixpacks picks a default that may drift between builds.
# Native modules (better-sqlite3) need python3 + gcc + make to compile.

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "npm run pipeline:daily"
